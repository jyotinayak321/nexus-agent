services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - nexus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nexus_db
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "8420:8420"
    volumes:
      - huggingface_cache:/opt/huggingface
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8420
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  nexus_postgres:
  huggingface_cache:
